# ============================================================
# Render Blueprint — mukti-taskplan planner A2A service (Docker)
# Deploy: Render Dashboard -> New -> Blueprint -> select this repo
# Then set A2A_SECRET / SERVICE_API_KEY (generated below).
# No browser env vars: this is the planner-only service.
# ============================================================
services:
  - type: web
    name: mukti-taskplan
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /data
      - key: AACP_LOG_DIR
        value: /data/logs
      - key: REPORTS_DIR
        value: /data/reports
      - key: OPENCODE_GLOBAL_DIR
        value: /root/.config/opencode
      - key: A2A_REQUIRE_SIGNATURES
        value: "true"
      - key: A2A_SECRET
        generateValue: true
      - key: SERVICE_API_KEY
        generateValue: true
    disk:
      name: mukti-data
      mountPath: /data
      sizeGB: 1
